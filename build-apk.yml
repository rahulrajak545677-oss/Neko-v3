name: Build APK

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # weekly: keeps the saved signing key from expiring (GitHub drops unused caches after 7 days)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -oq NekoAI*.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Release signing key. Best: add the 4 secrets (see README). Otherwise a key is made once and remembered in the cache.
      - name: Restore saved signing key
        uses: actions/cache@v4
        with:
          path: |
            neko-release.jks
            neko-release.pass
          key: neko-signing-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > neko-release.jks
            echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            if [ ! -f neko-release.jks ]; then
              openssl rand -hex 16 > neko-release.pass
              PASS=$(cat neko-release.pass)
              keytool -genkeypair -keystore neko-release.jks -alias neko -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" -dname "CN=Neko AI, O=Neko, C=IN"
            fi
            PASS=$(cat neko-release.pass)
            echo "::add-mask::$PASS"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=neko" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/neko-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK, release APK and release bundle
        run: |
          cd "$(dirname "$(find . -name settings.gradle.kts -print -quit)")"
          gradle assembleDebug assembleRelease bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NekoAI-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/NekoAI-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/NekoAI-release.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: NekoAI-release-apk
          path: NekoAI-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NekoAI-debug-apk
          path: NekoAI-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NekoAI-release-bundle-aab
          path: NekoAI-release.aab

      # Pushing a tag such as v1.0 also publishes the files on the Releases page
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NekoAI-release.apk
            NekoAI-release.aab
            NekoAI-debug.apk
